# StarVLA-OFT on Qwen3-VL-4B, LIBERO-Goal only (the novel-goal test needs Goal-only training: 4-in-1 data also
# covers LIBERO-10). Based on StarVLA @ 985c223 examples/simBenchmarks/LIBERO/train_files/starvla_cotrain_libero.yaml
# with the action head of the released StarVLA/Qwen3-VL-OFT-LIBERO-4in1 config.yaml. Changes, all deliberate:
#   framework.name QwenOFT; attn sdpa (no flash-attn wheel for aarch64 + torch 2.6); data_mix libero_goal;
#   vlm_data.model_type qwen3vl (the example says qwen2.5vl); freeze_modules '' (train everything, as released).
# Paths are relative to the StarVLA checkout (playground/ symlinks made by scripts/setup_starvla.sh).
run_id: starvla
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: none
wandb_project: langvla_starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    action_dim: 7
    action_hidden_dim: 2560
    action_model_type: DiT-B
    action_horizon: 8                  # chunk length; train_starvlm.py skips apply_config_compat, so set it here
    future_action_window_size: 7       # legacy alias = action_horizon - 1
    past_action_window_size: 0

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: libero_qa_lang
    eval_dataset: libero_qa_lang_heldout
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 4
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8           # x 4 GPUs x accum 4 = 128
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 5000              # optimizer steps; x 128 = ~12 epochs of LIBERO-Goal (~52k frames)
  num_warmup_steps: 1000
  save_interval: 2500
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1      # not used: StarVLA takes accumulation from the DeepSpeed config (bridges2/train_starvla.sbatch sets it)
  gradient_checkpointing: true
  is_resume: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
